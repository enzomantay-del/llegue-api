services:
  - type: web
    name: llegue-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Obligatorio en prod: connection string de Neon (o Supabase / Render Postgres).
      # Pegalo en Dashboard → Environment. NO lo subas a GitHub.
      - key: DATABASE_URL
        sync: false
      # Estables: si los regenerás, caen TODAS las sesiones.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_DEV_CODE
        value: "123456"
      - key: OTP_EXPOSE_DEV_CODE
        value: "false"
      - key: SEED_FAMILIA
        value: "false"
      - key: INVITE_PUBLIC_BASE_URL
        sync: false
      - key: APK_DOWNLOAD_URL
        value: https://github.com/enzomantay-del/llegue-mobile/releases/latest/download/Llegue.apk
